# Cloudflare Workers build config.
#
# Only here for the PLAN-READER PROXY. The app itself is a static file and has nothing
# to do with Cloudflare — this exists so that a Worker connected to this repo knows the
# entry point is proxy/gemini-worker.js and not index.html at the root.
#
# With this in place, editing proxy/gemini-worker.js on GitHub redeploys the Worker.
#
# THE API KEY DOES NOT GO IN THIS FILE, or in any file in this repo. It lives as an
# encrypted secret on Cloudflare:
#     Worker → Settings → Variables and Secrets → Add → Secret
#     Name: GEMINI_API_KEY
# That is the whole reason the proxy exists; see proxy/README.md.

name = "element26-gemini"
main = "proxy/gemini-worker.js"
compatibility_date = "2024-11-01"

# The ACCOUNT service is a second, separate Worker with its own config, because it needs
# a KV binding this one must not have: the plan reader should not be able to read a
# single byte of anybody's training data. See proxy/README.md for the four lines of
# wrangler.accounts.toml and the deploy command.

# PER-ADDRESS RATE LIMIT for the plan reader. The origin check above it stops a copy of
# the app hosted somewhere else; it does not stop a script, because Origin is a header
# and a script sends whatever it likes. This is what stops the script.
#
# 40 reads a minute per address is invisible to a real import and a loop still hits it in
# seconds. It was 20, which stopped being enough headroom once the app's retry budget grew:
# one import is two model calls and each may now retry up to five times, so a single
# failing import can legitimately cost ten requests and two attempts inside a minute used
# up the entire allowance. Being rate-limited by your own proxy for trying twice is
# indistinguishable, from the gym, from the servers being down.
#
# `namespace_id` is a label local to this Worker, not an id from the dashboard: pick any
# number and keep it. `period` accepts 10 or 60 only. Remove this block and the Worker
# still runs, unlimited — the code skips the check when the binding is absent rather than
# failing closed, so a config mistake cannot take the importer down.
[[unsafe.bindings]]
name = "PLAN_LIMIT"
type = "ratelimit"
namespace_id = "2601"
simple = { limit = 40, period = 60 }
